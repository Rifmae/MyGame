<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width,
    initial-scale=1.0">
    <title>Приключения героя</title>
    <style>
      *{ box-sizing: border-box; }
      body {
        margin: 0;
        background: #b8dfb3;
        font-family: AriaL, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      #game {
        width: min(100vw, 420px);
        height: min(100vh, 720px);
        min-height: 500px;
        position: relative;
        overflow: hidden;
        background: 
        linear-gradient(#b8dfb3, #e7f5d5);
        border: 5px solid #91bb8c;
        border-radius: 20px;
      }
      #score {
        position: absolute;
        top: 15px;
        width: 100%;
        text-align: center;
        font-size: 40px;
        font-weight: bold;
        color: white;
        text-shadow: 0 3px 5px #527c52;
        z-index: 3;
        }
        #hero {
          position: absolute;
          left: 70px;
          top: 240px;
          font-size: 55px;
          width: 65px;
          height: 65px;
          display: flex;
          justify-content: center;
          align-items: center;
          z-index: 2;
          user-select: none;
        }
        .pipe {
          position: absolute;
          width: 65px;
          background: #65b878;
          border: 4px solid #398e59;
          border-radius: 12px;
          }
          #message {
            position: absolute;
            inset: 0;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            color: #285b3c;
            background: #d8efcfed;
           }
           #message h1 {font-size: 30px;}
           button {
            padding: 14px 28px;
            border: 0;
            border-radius: 14px;
            background: #398e59;
            color: white;
            font-size: 20px;
            cursor: pointer;
           }
           </style>
           </head>
           <body>
            <div id="game">
              <div id="score">0</div>
             <div id="hero">😎</div>
            <div id="message">
            <h1>Приключения героя</h1>
            <p>Пролети между трубами!</p>
            <button id="start">Играть</button>
            <p>Нажимай на экран, чтобы взлететь</p>
            <div>
           </div>
           <script>
            const message =
            document.getElementById("message");
            const game =
            document.getElementById("game");
            const hero =
            document.getElementById("hero");
            const scoreText =
            document.getElementById("score");
            let y, velocity, pipes, score, playing, lastTime;
            const gravity= 0.00065;
            const jump= -0.28;
            const speed= 0.15;
            function addPipe() {
              const gap = 190;
              const topHeight = 60 + Math.random() *
              (game.clientHeight - gap - 130);
              const top =
              document.createElement("div");
              const bottom =
              document.createElement("div");
              top.className = "pipe";
              top.style.height = topHeight + "px";
              top.style.left = game.clientWidth + "px";
              top.style.top = "0";
              bottom.className = "pipe";
              bottom.style.height =
            (game.clientHeight - topHeight - gap) + "px";
            bottom.style.left =
            game.clientWidth + "px";
            bottom.style.bottom = "0";
            game.append(top,bottom);
            pipes.push({
            x: game.clientWidth,
            topHeight: topHeight,
            gap: gap,
            top: top,
            bottom: bottom,
            passed: false
            });
            }
            function startGame() {
              y = game.clientHeight * 0.4;
              velocity = 0;
              pipes =[];
              score = 0;
              playing = true;
              lastTime = 0;
              document.querySelectorAll(".pipe").forEach(p => p.remove());
              scoreText.textContent = "0";
              message.style.display = "none";
              addPipe();
              requestAnimationFrame(update);
            }
            function flap() {
              if (playing) velocity = jump;
            }
            function endGame() {
              playing = false;
              message.style.display ="flex";
              message.innerHTML =  `<h1>Игра окончена!</h1> <p>Твой счет: ${score}</p><button id="restart">Играть еще раз</button>`;
                  document.getElementById("restart").onclick = startGame;
            }
            function update(time) {
              if (!playing) return;
              const dt = Math.min(time - lastTime || time, 32);
              lastTime = time;
              velocity += gravity * dt;
              y += velocity * dt;
              hero.style.top = y + "px";
              hero.style.transform =
              'rotate(${Math.min(velocity * 100, 45)}deg)';
              const heroX = 70;
              const heroSize = 55;
              if (y < 0 || y + heroSize > game.clientHeight) {
                endGame();
                return;
              }
              for (const pipe of pipes) {
                pipe.x -= speed * dt;
                pipe.top.style.left = pipe.x +
                "px";
                pipe.bottom.style.left = pipe.x +
                "px";
                const hitX =
                heroX + heroSize > pipe.x && heroX < pipe.x + 65;
                if (hitX &&
                  (y < pipe.topHeight ||
                    y + heroSize >
                    pipe.topHeight + pipe.gap)) {
                      endGame();
                      return;
                    }
                    if(!pipe.passed && pipe.x + 65 < heroX) {
                      pipe.passed = true;
                      score++;
                      scoreText.textContent = score;
                    }
                    }
                    pipes = pipes.filter(pipe => { if (pipe.x < -70){
                      pipe.top.remove();
                      pipe.bottom.remove();
                      return false;
                    }
                    return true;
                  });
                  if (pipes.length > 0 &&
                    pipes[pipes.length - 1].x < game.clientWidth - 230) {
                      addPipe();
                    }
                    requestAnimationFrame(update);
                  }
                  game.addEventListener("pointerdown",event => {
                    if (event.target.tagName !=="BUTTON") flap();
                  });
                  document.getElementById("start").addEventListener("click",startGame)
           </script>
           </body>
           </html>
