<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Приключения героя</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #b8dfb3; font-family: Arial, sans-serif;
      display: flex; justify-content: center; align-items: center; min-height: 100vh;
      padding: 8px;
    }
    #game {
      width: min(100vw, 420px); height: min(100vh, 720px); min-height: 500px;
      position: relative; overflow: hidden; background: linear-gradient(#b8dfb3, #e7f5d5);
      border: 5px solid #91bb8c; border-radius: 20px; touch-action: manipulation;
      transition: background 700ms, border-color 700ms;
    }
    #game.sunset { background: linear-gradient(#ffb56b, #f7d5a3 58%, #f9e6bd); border-color: #e79b63; }
    #game.space { background: radial-gradient(ellipse at 50% 20%, #4e579c, #171b42 75%); border-color: #777ac8; }
    #game.magic { background: linear-gradient(145deg, #f4b7e8, #a8c8ff 55%, #c2f4dc); border-color: #bd8cce; }
    #score { position: absolute; top: 15px; width: 100%; text-align: center; font-size: 40px;
      font-weight: bold; color: white; text-shadow: 0 3px 5px #527c52; z-index: 3; pointer-events: none; }
    #worldLabel { position: absolute; top: 65px; width: 100%; text-align: center; color: white;
      font-size: 14px; text-shadow: 0 2px 4px #3338; z-index: 3; pointer-events: none; }
    #scenery { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .particle { position: absolute; left: var(--x); top: var(--y); opacity: var(--opacity, .75);
      animation: drift var(--duration, 8s) ease-in-out infinite alternate; will-change: transform; }
    .particle.star { width: var(--size, 4px); height: var(--size, 4px); background: #fff9bd;
      border-radius: 50%; box-shadow: 0 0 8px 2px #fff8a866; }
    .particle.sparkle { color: #fff; font-size: var(--size, 18px); text-shadow: 0 0 8px currentColor; }
    .particle.galaxy { width: var(--size, 38px); height: calc(var(--size, 38px) * .58);
      border: 2px solid #e4c9ff; border-radius: 50%; transform: rotate(-25deg);
      box-shadow: 0 0 9px #c5a5ff99, inset 0 0 8px #c5a5ff99; opacity: .6; }
    .particle.galaxy::after { content: ""; position: absolute; width: 25%; height: 25%; left: 38%; top: 32%;
      border-radius: 50%; background: #fff; box-shadow: 0 0 8px 4px #f3dcff; }
    .particle.cloud { width: 38px; height: 14px; border-radius: 20px; background: #fff9;
      filter: blur(1px); }
    .particle.leaf { font-size: var(--size, 18px); }
    @keyframes drift { from { translate: -3px 0; } to { translate: 5px -12px; } }

      background: linear-gradient(90deg, #398e59 0%, #7bd58b 24%, #5fc17a 58%, #348653 100%);
      border: 3px solid #287748; border-radius: 9px; box-shadow: inset 5px 0 0 #ffffff30, inset -5px 0 0 #174d2a25, 0 3px 7px #234b3633; }
    .pipe::before { content: ""; position: absolute; left: -8px; width: 73px; height: 25px;
      background: linear-gradient(180deg, #a0ed9d, #56b96d 45%, #32834c);
      border: 3px solid #287748; border-radius: 9px; box-shadow: inset 0 4px 0 #ffffff45, 0 3px 5px #234b3644; }
    .pipe.top::before { bottom: -2px; }
    .pipe.bottom::before { top: -2px; }
    .pipe::after { content: ""; position: absolute; left: 10px; top: 12px; bottom: 12px; width: 5px;
      border-radius: 5px; background: #ffffff35; }
    #game.sunset .pipe { background: linear-gradient(90deg, #367c70, #8ce0c4 28%, #69b9a0 62%, #367c70); border-color: #28665e; }
    #game.sunset .pipe::before { background: linear-gradient(180deg, #b8f2d7, #69b9a0 55%, #367c70); border-color: #28665e; }
    #game.space .pipe { background: linear-gradient(90deg, #4446a0, #a8a9ff 27%, #777be0 62%, #393b8c); border-color: #c4c6ff; box-shadow: inset 5px 0 0 #ffffff30, 0 0 12px #8f91ff55; }
    #game.space .pipe::before { background: linear-gradient(180deg, #e1ddff, #8589ff 55%, #4e50b6); border-color: #c4c6ff; }
    #game.magic .pipe { background: linear-gradient(90deg, #a94d9a, #ffc0ec 27%, #ff91ce 62%, #b74a9c); border-color: #a94d9a; box-shadow: inset 5px 0 0 #ffffff45, 0 0 10px #f89be255; }
    #game.magic .pipe::before { background: linear-gradient(180deg, #ffe1f6, #ff9cda 55%, #d45ab7); border-color: #a94d9a; }
    #mute { position: absolute; right: 10px; top: 10px; z-index: 6; padding: 8px 10px;
      border: 0; border-radius: 12px; background: #ffffffc9; font-size: 20px; cursor: pointer; }
    #message { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; padding: 24px;
      color: #285b3c; background: #d8efcfed; }
    #message h1 { font-size: 30px; margin-bottom: 6px; }
    #message p { line-height: 1.4; }
    button.action { padding: 14px 28px; border: 0; border-radius: 14px; background: #398e59;
      color: white; font-size: 20px; cursor: pointer; }
    #game.sunset #message { color: #773c3c; background: #fff0d9ed; }
    #game.space #message { color: #252654; background: #e5e6ffed; }
    #game.magic #message { color: #63316c; background: #fff0ffed; }
    #best { font-size: 14px; opacity: .8; }

</head>
<body>
  <div id="game">
    <div id="scenery" aria-hidden="true"></div>
    <div id="score">0</div>
    <div id="worldLabel">🌿 Зелёный мир</div>
    <button id="mute" aria-label="Включить или выключить звук" title="Звук">🔊</button>
    <div id="hero" aria-label="Герой"></div>
    <div id="message">
      <h1>Приключения героя</h1>
      <p>Пролети между трубами!</p>
      <button class="action" id="start">Играть</button>
      <p>Нажимай на экран, чтобы взлететь</p>
      <p id="best"></p>
    </div>
  </div>
<script>
  const message = document.getElementById("message");
  const game = document.getElementById("game");
  const hero = document.getElementById("hero");
  const scoreText = document.getElementById("score");
  const worldLabel = document.getElementById("worldLabel");
  const muteButton = document.getElementById("mute");
  const scenery = document.getElementById("scenery");

  let y, velocity, pipes, score, playing, lastTime, speed, pipesPassed;
  let muted = false;
  let audioContext = null;
  let previousGapCenter = null;

  const gravity = 0.00065;
  const jump = -0.28;
  const baseSpeed = 0.15;
  const maxSpeed = 0.23;
  const gapSize = 190;
  const heroX = 70;
  const heroSize = 55;
  const worlds = [
    { min: 0, className: "", label: "🌿 Зелёный мир" },
    { min: 25, className: "sunset", label: "🌅 Мир заката" },
    { min: 50, className: "space", label: "🚀 Космос" },
    { min: 75, className: "magic", label: "🌈 Волшебный мир" }
  ];

  function playSound(kind) {
    if (muted) return;
    try {
      audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === "suspended") audioContext.resume();
      const now = audioContext.currentTime;
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      const sounds = {
        flap: { freq: 520, end: 760, duration: 0.09, type: "sine" },
        point: { freq: 740, end: 1040, duration: 0.14, type: "sine" },
        crash: { freq: 180, end: 65, duration: 0.24, type: "triangle" },
        world: { freq: 440, end: 880, duration: 0.3, type: "sine" }
      };
      const sound = sounds[kind];
      osc.type = sound.type;
      osc.frequency.setValueAtTime(sound.freq, now);
      osc.frequency.linearRampToValueAtTime(sound.end, now + sound.duration);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(0.12, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + sound.duration);
      osc.connect(gain); gain.connect(audioContext.destination);
      osc.start(now); osc.stop(now + sound.duration);
    } catch (error) {
      // Если браузер не поддерживает звук, игра продолжит работать без него.
    }
  }

  function updateWorld() {
    const world = [...worlds].reverse().find(item => score >= item.min) || worlds[0];
    worlds.forEach(item => { if (item.className) game.classList.remove(item.className); });
    if (world.className) game.classList.add(world.className);
    worldLabel.textContent = world.label;
    createScenery(world.className);
  }

  function createScenery(worldName) {
    scenery.replaceChildren();
    const count = worldName === "space" ? 34 : 22;
    for (let i = 0; i < count; i++) {
      const particle = document.createElement("span");
      particle.className = "particle";
      particle.style.setProperty("--x", (Math.random() * 96) + "%");
      particle.style.setProperty("--y", (Math.random() * 94) + "%");
      particle.style.setProperty("--duration", (4 + Math.random() * 7) + "s");
      particle.style.setProperty("--size", (2 + Math.random() * 4) + "px");
      particle.style.setProperty("--opacity", (0.35 + Math.random() * 0.6).toFixed(2));
      if (worldName === "space") {
        if (i < 3) {
          particle.classList.add("galaxy");
          particle.style.setProperty("--size", (25 + Math.random() * 24) + "px");
        } else {
          particle.classList.add("star");
          if (i % 7 === 0) particle.style.boxShadow = "0 0 12px 4px #ffffff99";
        }
      } else if (worldName === "sunset") {
        if (i % 4 === 0) { particle.classList.add("cloud"); }
        else { particle.classList.add("sparkle"); particle.textContent = "✦"; particle.style.color = "#fff5cf"; }
      } else if (worldName === "magic") {
        particle.classList.add("sparkle");
        particle.textContent = ["✦", "✧", "✿", "❋"][i % 4];
        particle.style.color = ["#fff", "#ffdcfb", "#fff3a8", "#d9fff0"][i % 4];
      } else {
        particle.classList.add(i % 3 === 0 ? "leaf" : "sparkle");
        particle.textContent = i % 3 === 0 ? "🍃" : "✦";
        particle.style.color = i % 3 === 0 ? "#4f9d64" : "#fff8bd";
      }
      scenery.appendChild(particle);
    }
  }

  function getBest() {
    try { return Number(localStorage.getItem("heroBest") || 0); }
    catch (error) { return 0; }
  }
  function saveBest(value) {
    try { localStorage.setItem("heroBest", String(value)); } catch (error) {}
  }
  function showBest() {
    const best = document.getElementById("best");
    if (best) best.textContent = "Рекорд: " + getBest();
  }

  function addPipe() {
    const maxTop = game.clientHeight - gapSize - 110;
    const minTop = 55;
    let topHeight = minTop + Math.random() * Math.max(1, maxTop - minTop);

    // Следующий проход не смещается слишком далеко от предыдущего.
    if (previousGapCenter !== null) {
      const desiredCenter = topHeight + gapSize / 2;
      const maxShift = 70;
      const center = Math.max(previousGapCenter - maxShift,
        Math.min(previousGapCenter + maxShift, desiredCenter));
      topHeight = Math.max(minTop, Math.min(maxTop, center - gapSize / 2));
    }
    previousGapCenter = topHeight + gapSize / 2;

    const top = document.createElement("div");
    const bottom = document.createElement("div");
    top.className = "pipe top";
    bottom.className = "pipe bottom";
    top.style.height = topHeight + "px";
    top.style.left = game.clientWidth + "px";
    top.style.top = "0";
    bottom.style.height = (game.clientHeight - topHeight - gapSize) + "px";
    bottom.style.left = game.clientWidth + "px";
    bottom.style.bottom = "0";
    game.append(top, bottom);
    pipes.push({ x: game.clientWidth, topHeight, gap: gapSize, top, bottom, passed: false });
  }

  function startGame() {
    y = game.clientHeight * 0.4;
    velocity = 0;
    pipes = [];
    score = 0;
    speed = baseSpeed;
    pipesPassed = 0;
    previousGapCenter = null;
    playing = true;
    lastTime = 0;
    document.querySelectorAll(".pipe").forEach(pipe => pipe.remove());
    scoreText.textContent = "0";
    updateWorld();
    message.style.display = "none";
    hero.style.top = y + "px";
    hero.style.transform = "rotate(0deg)";
    addPipe();
    requestAnimationFrame(update);
  }

  function flap() {
    if (playing) {
      velocity = jump;
      playSound("flap");
    }
  }

  function endGame() {
    if (!playing) return;
    playing = false;
    playSound("crash");
    const best = Math.max(score, getBest());
    saveBest(best);
    message.style.display = "flex";
    message.innerHTML = `<h1>Игра окончена!</h1>
      <p>Твой счёт: ${score}</p>
      <p>Рекорд: ${best}</p>
      <button class="action" id="restart">Играть ещё раз</button>
      <p>Нажимай на экран, чтобы взлететь</p>`;
    document.getElementById("restart").addEventListener("click", startGame);
  }

  function update(time) {
    if (!playing) return;
    const dt = Math.min(time - lastTime || 16, 32);
    lastTime = time;
    velocity += gravity * dt;
    y += velocity * dt;
    hero.style.top = y + "px";
    hero.style.transform = `rotate(${Math.max(-25, Math.min(45, velocity * 100))}deg)`;

    if (y < 0 || y + heroSize > game.clientHeight) {
      endGame();
      return;
    }

    for (const pipe of pipes) {
      pipe.x -= speed * dt;
      pipe.top.style.left = pipe.x + "px";
      pipe.bottom.style.left = pipe.x + "px";
      const hitX = heroX + heroSize > pipe.x && heroX < pipe.x + 65;
      if (hitX && (y < pipe.topHeight || y + heroSize > pipe.topHeight + pipe.gap)) {
        endGame();
        return;
      }
      if (!pipe.passed && pipe.x + 65 < heroX) {
        pipe.passed = true;
        score++;
        pipesPassed++;
        scoreText.textContent = score;
        playSound("point");
        if (score % 25 === 0) {
          updateWorld();
          playSound("world");
        }
        // Скорость растёт постепенно, но не становится чрезмерной.
        if (pipesPassed % 5 === 0) speed = Math.min(maxSpeed, speed + 0.01);
      }
    }

    pipes = pipes.filter(pipe => {
      if (pipe.x < -70) {
        pipe.top.remove(); pipe.bottom.remove();
        return false;
      }
      return true;
    });

    if (pipes.length > 0 && pipes[pipes.length - 1].x < game.clientWidth - 230) addPipe();
    requestAnimationFrame(update);
  }

  game.addEventListener("pointerdown", event => {
    if (event.target.closest("button")) return;
    flap();
  });
  document.getElementById("start").addEventListener("click", startGame);
  muteButton.addEventListener("click", () => {
    muted = !muted;
    muteButton.textContent = muted ? "🔇" : "🔊";
    muteButton.title = muted ? "Звук выключен" : "Звук включён";
    if (!muted) playSound("point");
  });
  showBest();
</script>
</body>
</html>
